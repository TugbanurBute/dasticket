
services:
  postgres:
    image: postgres:17

    container_name: dasticket-postgres

    restart: always

    ports:
      - "5432:5432"

    environment:
      POSTGRES_DB: dasticket
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: