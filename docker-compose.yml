
services:
  postgres:
    image: postgres:17
    container_name: dasticket-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: dasticket
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dasticket"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: dasticket-app
    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:8080"

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      JWT_SECRET: ${JWT_SECRET}
      DB_URL: jdbc:postgresql://postgres:5432/dasticket
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

volumes:
  postgres_data:

